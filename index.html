<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>grapesjs-ruler dev</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css" />
  <style>html, body { margin: 0; height: 100%; }</style>
  <script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"></script>
  <script src="https://unpkg.com/grapesjs-preset-webpage@1.0.3/dist/index.js"></script>
</head>
<body>
  <div id="gjs"></div>
  <script type="module">
    import grapesjsRuler from './src/index.ts';
    window.editor = grapesjs.init({
      container: '#gjs',
      height: '100vh',
      storageManager: false,
      components: '<div style="margin:100px 50px;width:200px;height:80px;background:#fc0">Box</div>',
      plugins: ['grapesjs-preset-webpage', grapesjsRuler],
    });
  </script>
</body>
</html>
